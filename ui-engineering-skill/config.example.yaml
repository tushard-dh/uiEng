version: "1.0"
skill: ui-engineering
mcp:
  mobbin:
    enabled: true
    required_for_reference_work: false
design_system:
  source: "application"
  token_policy: "semantic"
component_catalog:
  enabled: true
  paths:
    - "src/components"
  extensions: [".tsx", ".jsx", ".vue", ".svelte"]
  stale_after_days: 14
workflow:
  require_spec_before_build: true
  ask_high_impact_questions_only: true
  mode: "standard"  # quick | standard | thorough — see workflows/mode.md
decision_memory:
  enabled: true
  promote_after_confirmations: 2
mocking:
  default_lang: null  # html | react | typescript — null means ask/infer
  output_dir: "mocks"  # top-level, sibling of .ui-engineering/ — mocks are
                        # meant to be opened/run directly, not buried in
                        # the internal knowledge folder
validation:
  deterministic: true
  accessibility: true
  responsive: true
